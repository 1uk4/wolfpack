---
# Co-located wolves (own config dir) run their own tmux server (-L <name>);
# the original single-wolf host is on the default socket.
- name: Compute tmux socket flag
  set_fact:
    wolf_tmux: "{{ '-L ' ~ wolf_name if wolf_config_dir is defined else '' }}"

- name: Create systemd service
  template:
    src: wolf.service.j2
    dest: "/etc/systemd/system/{{ wolf_name }}.service"
  notify: restart wolf

- name: Flush handlers (restart wolf now if the unit file changed)
  meta: flush_handlers

- name: Enable and start wolf service
  systemd:
    name: "{{ wolf_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wolf service status
  command: systemctl is-active {{ wolf_name }}
  register: wolf_svc_active
  changed_when: false
  failed_when: false

- name: Wait for tmux session to exist
  command: sudo -iu {{ wolf_user }} tmux {{ wolf_tmux }} has-session -t {{ wolf_name }}
  register: tmux_check
  retries: 12
  delay: 5
  until: tmux_check.rc == 0
  changed_when: false
  failed_when: tmux_check.rc != 0

- name: Wait for telegram plugin to load into the pane
  # Grep the live tmux pane for an indicator that the telegram channel plugin
  # has been attached. We accept several version-specific strings because
  # claude's startup banner has changed shape over time:
  #   - "Listening for channel messages"  (pre-2.1)
  #   - "plugin:telegram@claude-plugins-official"  (2.1.251, printed in the
  #     "Channels (experimental) messages from <plugin> inject directly..."
  #     banner that renders at the top of the pane once claude is up)
  # Any of them means the plugin is loaded.
  #
  # -S - captures the ENTIRE pane history. The banner renders at the top on
  # startup, so if pairing output or any post-startup activity has pushed it
  # past a few hundred lines of scrollback, a narrow window would miss it.
  shell: |
    sudo -iu {{ wolf_user }} tmux {{ wolf_tmux }} capture-pane -t {{ wolf_name }} -p -S -
  register: pane_capture
  retries: 24
  delay: 5
  until: >
    'Listening for channel messages' in pane_capture.stdout
    or 'plugin:telegram@claude-plugins-official' in pane_capture.stdout
  changed_when: false
  when: wolf_runtime | default('claude') == 'claude'

- name: Smoke test passed
  debug:
    msg:
      - "✅ wolf-service '{{ wolf_name }}' is live:"
      - "    - systemd status:  {{ wolf_svc_active.stdout }}"
      - "    - tmux session:    present"
      - "    - telegram plugin: {{ 'bot.pid alive' if wolf_runtime | default('claude') == 'claude' else 'n/a for pi runtime' }}"

- name: Show wolf service status
  debug:
    msg:
      - "🐺 wolf-service '{{ wolf_name }}' status: {{ wolf_svc_active.stdout }}"
      - "    Attach to live claude session: sudo -iu {{ wolf_user }} tmux attach -t {{ wolf_name }}"
      - "    (detach with Ctrl-b then d — do NOT Ctrl-c, that kills claude)"
      - "    Service logs:  journalctl -u {{ wolf_name }} -f"
      - "    Stop:          systemctl stop {{ wolf_name }}"
      - "    Start:         systemctl start {{ wolf_name }}"
