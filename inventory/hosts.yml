all:
  vars:
    wolf_user: wolf
    owner_telegram_id: "7357687500"
    mac_syncthing_device_id: "{{ lookup('env', 'MAC_SYNCTHING_DEVICE_ID') }}"

  children:
    wolves:
      # ⚠️  These are LIVE, hand-customized Claude wolves on one shared droplet
      # (single `wolf` user). Their on-box layout has diverged from the roles
      # (snapjack-bi uses CLAUDE_CONFIG_DIR + a separate `tmux -L` socket +
      # its own den path). This inventory tracks them for the CLI + CC bot
      # (list/status/logs/restart). Do NOT run ./bootstrap.sh against them —
      # the standard workspace/wolf-service roles would clobber the custom
      # setup. Reprovisioning is a separate, deliberate migration.
      hosts:
        hal:
          ansible_host: 100.105.247.31
          ansible_ssh_private_key_file: ~/.ssh/wolfpack
          ansible_ssh_extra_args: "-o IdentityAgent=none"
          wolf_name: hal
          telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN_HAL') }}"
        snapjack-bi:
          ansible_host: 100.105.247.31
          ansible_ssh_private_key_file: ~/.ssh/wolfpack
          ansible_ssh_extra_args: "-o IdentityAgent=none"
          wolf_name: snapjack-bi
          tmux_socket: snapjack-bi          # runs on `tmux -L snapjack-bi`, not the default socket
          telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN_SNAPJACK_BI') }}"

    # ---------------------------------------------------------------------
    # PI wolves (experimental agent type). Same infra as `wolves` but runs
    # the pi coding agent + @llblab/pi-telegram bridge instead of Claude
    # Code. Provision ONLY these with ./bootstrap-pi.sh — the Claude
    # bootstrap.sh never touches this group.
    # ---------------------------------------------------------------------
    pi_wolves:
      vars:
        # pi model defaults for every pi-wolf (override per host below).
        pi_provider: anthropic
        pi_model: "claude-sonnet-4"
      # CO-LOCATION: pi_colocated: true runs the wolf under the shared `wolf`
      # user, isolated by its own den path + pi config dir + a `tmux -L <name>`
      # socket, syncing to the Mac via the host's EXISTING syncthing@wolf
      # instance (no port clash). See README-PI.md.
      hosts:
        forge:
          ansible_host: 100.105.247.31         # the existing droplet (its Tailscale IP)
          ansible_ssh_private_key_file: ~/.ssh/wolfpack
          ansible_ssh_extra_args: "-o IdentityAgent=none"
          wolf_name: forge
          pi_colocated: true                   # co-locate under the shared `wolf` user
          pi_role: ops
          pi_specialty: "wolfpack builder + droplet ops"
          telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN_FORGE') }}"
          pi_repos:
            - name: wolfpack
              url: git@github.com:1uk4/wolfpack.git
          # pi_model: "claude-sonnet-4"        # optional per-host override
          # pi_enable_syncthing: false         # set to skip sync entirely (den local only)

    cc_hosts:
      # Hosts that run the Wolfpack command-center bot. A host can be in
      # both cc_hosts and wolves (same droplet hosts both the bot and a
      # wolf). When the pack outgrows one box, move cc_hosts to its own
      # droplet; inventory is the only thing that needs to change.
      hosts:
        hal:
