# CI: VERIFY only. No secrets, no artifacts published (release artifacts are built at release time, not here).
# Feature work (any push, PR into a non-stable branch): affected-only. A "release" (PR into stable, push to stable): the whole suite,
# tracer and release-smoke unconditionally, plus the eval project. Live tests (real Claude) never run here: `wolfpack pr prepare` runs them on the Mac.
# scripts/affected.mjs decides what runs: changed packages + their transitive dependents.
name: ci
on:
  push:
    branches: ['**']   # tag pushes (<component>/vX.Y.Z) are release.yml's, not CI's
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      affected: ${{ steps.a.outputs.affected }}
      any: ${{ steps.flags.outputs.any }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false   # no install in this job: skip v6's automatic cache restore/save
      - id: release
        name: release run? (PR into stable or push to stable)
        env:
          RELEASE: ${{ github.base_ref == 'stable' || github.ref == 'refs/heads/stable' }}
        run: echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
      - id: a
        name: affected packages
        env:
          RELEASE: ${{ steps.release.outputs.release }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # a release runs everything: an empty base makes affected.mjs mark all packages
          if [ "$RELEASE" = true ]; then BASE=""; fi
          # first push / zero sha / unreachable base => affected.mjs marks everything
          node scripts/affected.mjs "$BASE" "$HEAD" --github-output
      - id: flags
        run: |
          node -e 'const a=JSON.parse(process.env.A);console.log("any="+(a.all||a.packages.length>0||a.extensionsTests||a.scriptsTests))' >> "$GITHUB_OUTPUT"
        env:
          A: ${{ steps.a.outputs.affected }}

  verify:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      A: ${{ needs.detect.outputs.affected }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4   # no `version:`: it reads packageManager from package.json, so CI and dev use the same pnpm
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm   # caches the pnpm store (not node_modules), keyed on pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lockfile guard (package-lock.json is current, both locks agree)
        # npm still builds the release from package-lock.json; this fails a PR that changed a package.json without regenerating both locks.
        run: pnpm check:lockfiles
      - name: test environment (git identity + pack models block; no secrets)
        # Some suites commit in temp repos and resolve models from ~/.wolfpack/config.yaml, which a dev box has and a runner does not.
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          mkdir -p ~/.wolfpack
          printf 'models:\n  main:  { model: claude-opus-5-5 }\n  smart: { model: claude-sonnet-5-5 }\n  fast:  { model: claude-haiku-5-5 }\n  transport:\n    local: subscription\n    vps: api\n' > ~/.wolfpack/config.yaml
      - name: tsc --build (affected projects)
        run: |
          mapfile -t P < <(node -p 'JSON.parse(process.env.A).tsProjects.join("\n")')
          [ ${#P[@]} -gt 0 ] && pnpm exec tsc --build "${P[@]}" || echo "no TS projects affected"
      - name: vitest (affected packages)
        run: |
          ALL=$(node -p 'JSON.parse(process.env.A).all')
          if [ "$ALL" = true ]; then pnpm exec vitest run --project default; exit; fi
          mapfile -t F < <(node -e '
            const a=JSON.parse(process.env.A);
            const f=[...a.vitestPaths];
            if(a.extensionsTests)f.push("extensions/");
            if(a.scriptsTests)f.push("scripts/");
            console.log(f.join("\n"))')
          [ -n "${F[0]:-}" ] && pnpm exec vitest run --project default "${F[@]}" || echo "no vitest paths affected"
      - name: console tests
        if: fromJSON(needs.detect.outputs.affected).consoleTests
        run: pnpm --filter @wolfpack/console test

  tracer:
    needs: detect
    if: needs.detect.outputs.release == 'true' || fromJSON(needs.detect.outputs.affected).tracer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: stub tracer (hubd + workerd + stub wolfd, no secrets)
        run: infra/tracer/run-tracer.sh

  release-smoke:
    needs: detect
    if: needs.detect.outputs.release == 'true' || fromJSON(needs.detect.outputs.affected).release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false   # no install in this job: skip v6's automatic cache restore/save
      - name: build wolfd release (x64, local only, not uploaded)
        run: scripts/build-wolfd-release.sh --arch x64 --out "$RUNNER_TEMP/rel"
      - name: smoke the tarball
        run: scripts/smoke-wolfd-release.sh "$(ls "$RUNNER_TEMP"/rel/wolfd-*-linux-x64.tar.gz)"

  eval:
    # slow evals (KB tree-rules, llm-split), release runs only; skipped (counts as passing) elsewhere
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-eval-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false   # an eval run is expensive: let it finish rather than cancel on a new push
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: test environment (git identity + pack models block; no secrets)
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
          mkdir -p ~/.wolfpack
          printf 'models:\n  main:  { model: claude-opus-5-5 }\n  smart: { model: claude-sonnet-5-5 }\n  fast:  { model: claude-haiku-5-5 }\n  transport:\n    local: subscription\n    vps: api\n' > ~/.wolfpack/config.yaml
      - name: build kb and the projects it references (the evals import @wolfpack/engine from dist)
        run: pnpm exec tsc --build packages/kb
      - run: pnpm test:eval

  ci:
    if: always()
    needs: [detect, verify, tracer, release-smoke, eval]
    runs-on: ubuntu-24.04
    steps:
      - name: all required jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if echo '${{ toJSON(needs.*.result) }}' | grep -Eq 'failure|cancelled'; then exit 1; fi
