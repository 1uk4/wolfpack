---
# Provisions a PI-based wolf (experimental agent type). Same host hardening,
# Tailscale, and Syncthing as the Claude wolves, but runs the pi coding agent
# + @llblab/pi-telegram bridge instead of Claude Code.
#
# Targets the `pi_wolves` inventory group ONLY — it never touches Claude
# wolves. Run it with ./bootstrap-pi.sh (not ./bootstrap.sh).

- name: Bootstrap a pi-wolf
  hosts: pi_wolves
  become: true

  vars:
    tailscale_authkey: "{{ lookup('env', 'TAILSCALE_AUTHKEY') }}"

  pre_tasks:
    - name: Create wolf user
      user:
        name: "{{ wolf_user }}"
        shell: /bin/bash
        groups: sudo
        create_home: true

    - name: Allow wolf user sudo without password
      copy:
        content: "{{ wolf_user }} ALL=(ALL) NOPASSWD:ALL"
        dest: "/etc/sudoers.d/{{ wolf_user }}"
        mode: "0440"

    - name: Authorize SSH key for wolf user
      authorized_key:
        user: "{{ wolf_user }}"
        state: present
        key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/wolfpack.pub') }}"

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install essentials
      apt:
        name: [curl, git, ufw, fail2ban, unzip, tmux]
        state: present

    - name: Configure UFW defaults
      ufw:
        direction: incoming
        policy: deny

    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Disable root password login
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PermitRootLogin"
        line: "PermitRootLogin prohibit-password"
      notify: restart sshd

    - name: Generate SSH keypair for wolf user (for GitHub etc.)
      become_user: "{{ wolf_user }}"
      command: ssh-keygen -t ed25519 -f /home/{{ wolf_user }}/.ssh/id_ed25519 -C "{{ wolf_name }}@wolfpack" -N ""
      args:
        creates: "/home/{{ wolf_user }}/.ssh/id_ed25519"

    - name: Set git identity
      become_user: "{{ wolf_user }}"
      git_config:
        name: "{{ item.name }}"
        scope: global
        value: "{{ item.value }}"
      loop:
        - { name: user.name, value: "{{ wolf_name }}" }
        - { name: user.email, value: "{{ wolf_name }}@wolfpack.local" }

    # ------------------------------------------------------------------
    # Resolve the on-box layout. Two modes:
    #  - dedicated (default): own user/paths, ~/.pi/agent, default tmux,
    #    its own syncthing@<user> instance.
    #  - co-located (pi_colocated: true): multiple wolves share one unix
    #    user, isolated by per-wolf den path + pi config dir (PI_CODING_AGENT_DIR)
    #    + a dedicated `tmux -L <wolf>` socket, reusing the host's existing
    #    syncthing@<user> instance (so dens still sync to the Mac).
    # ------------------------------------------------------------------
    - name: Resolve pi-wolf layout (co-located vs dedicated)
      set_fact:
        pi_base_dir: "{{ ('/home/' ~ wolf_user ~ '/wolves/' ~ wolf_name) if (pi_colocated | default(false)) else ('/home/' ~ wolf_user ~ '/workspace') }}"
        pi_config_dir: "{{ ('/home/' ~ wolf_user ~ '/wolves/' ~ wolf_name ~ '/pi') if (pi_colocated | default(false)) else ('/home/' ~ wolf_user ~ '/.pi/agent') }}"
        pi_shared_dir: "/home/{{ wolf_user }}/workspace/shared"
        pi_tmux_socket: "{{ wolf_name if (pi_colocated | default(false)) else '' }}"

    - name: Derive pi-wolf sub-paths
      set_fact:
        pi_den_dir: "{{ pi_base_dir }}/den"
        pi_repos_dir: "{{ pi_base_dir }}/repos"
        pi_env_file: "{{ pi_config_dir }}/pi.env"
        pi_tmux_cmd: "{{ '/usr/bin/tmux -L ' ~ pi_tmux_socket if pi_tmux_socket else '/usr/bin/tmux' }}"

  roles:
    - tailscale
    - bun
    - pi
    - pi-telegram
    - pi-workspace
    - pi-repos
    # Syncthing, three ways:
    #  - dedicated + enabled  -> full syncthing role (its own instance)
    #  - co-located + enabled -> add the den folder to the host's EXISTING
    #                            syncthing@<user> instance (no port clash)
    #  - pi_enable_syncthing: false -> no sync (den local only)
    - role: syncthing
      when: (not (pi_colocated | default(false))) and (pi_enable_syncthing | default(true))
    - role: pi-syncthing-folder
      when: (pi_colocated | default(false)) and (pi_enable_syncthing | default(true))
    - pi-wolf-service

  post_tasks:
    - name: Get Tailscale IP for summary
      command: tailscale ip -4
      register: final_ts_ip
      changed_when: false

    - name: Get Syncthing device ID for summary
      command: syncthing --device-id
      become_user: "{{ wolf_user }}"
      register: final_st_id
      changed_when: false
      when: pi_enable_syncthing | default(true)

    - name: Check pi-wolf service status
      command: systemctl is-active {{ wolf_name }}
      register: pi_svc_status
      changed_when: false
      failed_when: false

    - name: Update inventory/hosts.yml to use Tailscale IP
      delegate_to: localhost
      become: false
      replace:
        path: "{{ playbook_dir }}/../inventory/hosts.yml"
        regexp: '(^\s*{{ inventory_hostname }}:\s*\n(?:\s+[^\n]*\n)*?\s+ansible_host:\s*)\S+'
        replace: '\g<1>{{ final_ts_ip.stdout }}'

    - name: "🐺 PI-WOLF BOOTSTRAP COMPLETE — post-run checklist"
      debug:
        msg:
          - "================================================================"
          - "  {{ wolf_name | upper }} (pi) is provisioned."
          - "================================================================"
          - "  Tailscale IP:      {{ final_ts_ip.stdout }}"
          - "  Syncthing ID:      {{ final_st_id.stdout }}"
          - "  pi-wolf-service:   {{ pi_svc_status.stdout }}"
          - ""
          - "  Layout:            {{ 'co-located (user ' ~ wolf_user ~ ', tmux -L ' ~ wolf_name ~ ')' if (pi_colocated | default(false)) else 'dedicated' }}"
          - "  Den:               {{ pi_den_dir }}"
          - "  Syncthing:         {{ 'enabled' if (pi_enable_syncthing | default(true)) else 'DISABLED (den is local-only on this host)' }}"
          - ""
          - "  MANUAL STEPS REMAINING:"
          - "  1. Accept the new Syncthing folder on your Mac:"
          - "       device '{{ wolf_user if (pi_colocated | default(false)) else wolf_name }}' (ID: {{ final_st_id.stdout | default('n/a — syncthing disabled') }})"
          - "       {{ '(already paired — just accept the new folder)' if (pi_colocated | default(false)) else ('set Addresses to  tcp://' ~ final_ts_ip.stdout ~ ':22000') }}"
          - "       folder 'den-{{ wolf_name }}'  → ~/Code/wolfpack/dens/{{ wolf_name }}  (Send & Receive)"
          - "       (SKIP step 1 entirely if Syncthing is DISABLED above.)"
          - "  2. DM the Telegram bot and send /start to verify the bridge."
          - "     (Owner {{ owner_telegram_id }} is pre-allowlisted.)"
          - "  3. If the pane shows a /login prompt, set ANTHROPIC_API_KEY in .env"
          - "     and re-run, or run /login once in the tmux pane."
          - "================================================================"

  handlers:
    - name: restart sshd
      service:
        name: sshd
        state: restarted
