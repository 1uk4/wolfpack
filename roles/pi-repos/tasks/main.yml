---
# pi-repos role — clones working repos onto a pi-wolf so it can build/manage
# them (e.g. the wolfpack framework repo itself). Controlled by the per-host
# `pi_repos` list in inventory. Skipped entirely when unset.
#
# These clones are the wolf's WORKSPACE, not its memory: they live under
# ~/workspace/repos/ (outside the Syncthing-managed den) and are pushed to
# GitHub by the wolf, then pulled to your Mac. Keeps framework (git) and
# memory (den/Syncthing) cleanly separated.
#
# Cloning private repos needs the wolf's SSH key on GitHub — that's the
# one-time manual step the playbook prints. Clone failures are non-fatal so
# the play finishes; re-run after adding the key to complete the clone.

- name: Create repos workspace directory
  file:
    path: "{{ pi_repos_dir }}"
    state: directory
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
  when: pi_repos | default([]) | length > 0

- name: Clone configured repos (best-effort)
  become_user: "{{ wolf_user }}"
  git:
    repo: "{{ item.url }}"
    dest: "{{ pi_repos_dir }}/{{ item.name }}"
    # 'update'/'version' are only read when the key truly exists; otherwise
    # item['update'] falls back to the dict's built-in update() method in
    # ansible-core 2.20's lazy templating.
    version: "{{ item['version'] if 'version' in item else 'HEAD' }}"
    update: "{{ item['update'] if 'update' in item else false }}"
    accept_hostkey: true
  loop: "{{ pi_repos | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: pi_repo_clone
  failed_when: false

- name: Report repo clone results
  debug:
    msg: >-
      📦 repo '{{ item.item.name }}':
      {{ 'cloned/updated' if not item.failed else 'FAILED — likely the wolf SSH key is not on GitHub yet. Add it (printed above) and re-run.' }}
  loop: "{{ pi_repo_clone.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: pi_repos | default([]) | length > 0
