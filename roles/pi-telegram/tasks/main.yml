---
# pi-telegram role — installs the @llblab/pi-telegram bridge (a pi package:
# extension + skills) and preconfigures the owner allowlist so the bot only
# talks to you. This is the PI equivalent of the `telegram` role.
#
# The bridge is a "runtime adapter": pi runs in a long-lived tmux session
# (see pi-wolf-service) and the bridge is activated with `/telegram-connect`.
# Owner authorization is pinned here via profiles.default.allowedUserId, so
# no first-contact `/start` pairing race is possible.

- name: Ensure pi config directory exists
  file:
    path: "{{ pi_config_dir }}"
    state: directory
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
    mode: "0700"

- name: Install the pi-telegram bridge package (wolf user)
  # PI_CODING_AGENT_DIR ensures the bridge registers in THIS wolf's config,
  # not a shared ~/.pi/agent (critical when wolves share a unix user).
  command: pi install npm:@llblab/pi-telegram
  become_user: "{{ wolf_user }}"
  register: pi_tg_install
  changed_when: "'Installing' in pi_tg_install.stdout or 'Added' in pi_tg_install.stdout"
  failed_when: pi_tg_install.rc != 0 and 'already' not in (pi_tg_install.stderr | lower)
  environment:
    PATH: "/home/{{ wolf_user }}/.bun/bin:/usr/local/bin:/usr/bin:/bin"
    PI_CODING_AGENT_DIR: "{{ pi_config_dir }}"

- name: Deploy telegram.json (bot token via env ref + owner allowlist)
  # botToken is stored as an env reference ($TELEGRAM_BOT_TOKEN) rather than
  # the secret itself; the actual token is injected into the pi-wolf service
  # environment. allowedUserId pins the owner so strangers are ignored.
  template:
    src: telegram.json.j2
    dest: "{{ pi_config_dir }}/telegram.json"
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
    mode: "0600"
  notify: restart pi-wolf

- name: pi-telegram status
  debug:
    msg:
      - "📨 pi-telegram bridge installed for {{ wolf_name }}"
      - "    Bot token: ...{{ telegram_bot_token[-6:] }} (last 6 chars, via $TELEGRAM_BOT_TOKEN)"
      - "    Owner allowlisted: {{ owner_telegram_id }}"
      - "    Activated at startup via '/telegram-connect' (see pi-wolf-service)."
      - "    ACTION: once the service is up, DM the bot and send /start to verify."
