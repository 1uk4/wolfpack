# Release: push a tag <component>/vX.Y.Z (component = wolfd | workerd | hubd | console) -> build ONLY that component
# for linux-x64 on a native x64 runner, guard against secrets, smoke (wolfd), publish a GitHub Release.
# No secrets besides the built-in GITHUB_TOKEN (contents: write). Components: scripts/release-components.json.
name: release
on:
  push:
    tags: ['*/v[0-9]*.[0-9]*.[0-9]*']
  workflow_call:   # release-stable.yml builds each auto-created tag here (GITHUB_TOKEN tag pushes trigger no workflows)
    inputs:
      tag:
        description: existing tag <component>/vX.Y.Z to build
        type: string
        required: true
  workflow_dispatch:   # manually rebuild a tag whose build failed
    inputs:
      tag:
        description: existing tag <component>/vX.Y.Z to build
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04   # native x64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}   # input tag when called/dispatched, else the pushed tag
          fetch-depth: 0   # release notes need the history and the previous tags
          persist-credentials: false   # nothing in this job pushes; gh uses GH_TOKEN, not the checkout credential
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false   # release builds never restore a shared cache (setup-node v6 would enable npm caching automatically)
      - name: parse tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}   # empty on a tag push
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^([a-z0-9]+)/v([0-9]+\.[0-9]+\.[0-9]+(-main\.[1-9][0-9]*)?)$ ]]; then echo "::error::tag '$TAG' is not <component>/vX.Y.Z or <component>/vX.Y.Z-main.N"; exit 1; fi
          COMP="${BASH_REMATCH[1]}"; VER="${BASH_REMATCH[2]}"
          PRE=""; if [[ "$VER" == *-main.* ]]; then PRE="--prerelease"; fi
          node -e 'const c=require("./scripts/release-components.json");if(!c[process.argv[1]]||process.argv[1][0]=="_"){console.error("::error::unknown component "+process.argv[1]);process.exit(1)}' "$COMP"
          ASSET=$(node -p 'require("./scripts/release-components.json")[process.argv[1]].asset.replace("{version}",process.argv[2])' "$COMP" "$VER")
          SMOKE=$(node -p 'require("./scripts/release-components.json")[process.argv[1]].smoke' "$COMP")
          { echo "tag=$TAG"; echo "component=$COMP"; echo "version=$VER"; echo "asset=$ASSET"; echo "smoke=$SMOKE"; echo "prerelease=$PRE"; } >> "$GITHUB_OUTPUT"
      - run: npm ci --no-audit --no-fund
        if: steps.tag.outputs.component != 'wolfd'   # wolfd is built inside Docker (infra/release/Dockerfile)
      - name: build + stamp + guard + sha256 (${{ steps.tag.outputs.component }} only)
        run: scripts/release-build.sh "${{ steps.tag.outputs.component }}" "${{ steps.tag.outputs.version }}" "$RUNNER_TEMP/rel"
      - name: smoke the wolfd tarball
        if: steps.tag.outputs.smoke == 'true'
        run: scripts/smoke-wolfd-release.sh "$RUNNER_TEMP/rel/${{ steps.tag.outputs.asset }}"
      - name: verify sha256 file
        run: cd "$RUNNER_TEMP/rel" && sha256sum -c "${{ steps.tag.outputs.asset }}.sha256"
      - name: release notes
        run: scripts/release-notes.sh "${{ steps.tag.outputs.component }}" "${{ steps.tag.outputs.tag }}" > "$RUNNER_TEMP/notes.md"
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            "$RUNNER_TEMP/rel/${{ steps.tag.outputs.asset }}" \
            "$RUNNER_TEMP/rel/${{ steps.tag.outputs.asset }}.sha256" \
            --title "${{ steps.tag.outputs.tag }}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag ${{ steps.tag.outputs.prerelease }}
