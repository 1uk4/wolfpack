all:
  vars:
    wolf_user: wolf
    owner_telegram_id: "7357687500"
    mac_syncthing_device_id: "{{ lookup('env', 'MAC_SYNCTHING_DEVICE_ID') }}"

    # Interaction layer for a wolf. Per-wolf override below.
    #   claude : Claude Code CLI + telegram plugin channel   (default)
    #   pi      : the pi coding agent + @llblab/pi-telegram bridge
    # The den is runtime-agnostic, so this can be flipped and redeployed
    # (playbooks/redeploy.yml  /  `wolfpack runtime <wolf> <pi|claude>`)
    # without losing a wolf's memory or identity.
    wolf_runtime: claude

  children:
    wolves:
      # ⚠️  These are LIVE, hand-customized wolves on one shared droplet
      # (single `wolf` user). Co-located wolves (own config dir + own tmux
      # server) are marked with wolf_config_dir/wolf_den. Their on-box layout
      # has diverged from the default single-wolf role paths — reprovisioning
      # is a separate, deliberate migration, not a rerun of bootstrap.yml.
      hosts:
        hal:
          ansible_host: 100.105.247.31
          ansible_ssh_private_key_file: ~/.ssh/wolfpack
          ansible_ssh_extra_args: "-o IdentityAgent=none"
          wolf_name: hal
          wolf_runtime: claude
          telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN_HAL') }}"

        # Co-located packmates on the same droplet + user, each with its own
        # tmux server (-L <name>), config dir, and den. Added post-bootstrap
        # via `wolfpack add`; declared here so `redeploy.yml` can flip their
        # runtime.
        forge:
          ansible_host: 100.105.247.31
          ansible_ssh_private_key_file: ~/.ssh/wolfpack
          ansible_ssh_extra_args: "-o IdentityAgent=none"
          wolf_name: forge
          wolf_runtime: claude
          wolf_den: /home/wolf/wolves/forge/den
          wolf_config_dir: /home/wolf/wolves/forge/claude
          wolf_role: ops
          wolf_specialty: "wolfpack builder + droplet ops"
          telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN_FORGE') }}"
          wolf_repos:
            - name: wolfpack
              url: git@github.com:1uk4/wolfpack.git

        snapjack-bi:
          ansible_host: 100.105.247.31
          ansible_ssh_private_key_file: ~/.ssh/wolfpack
          ansible_ssh_extra_args: "-o IdentityAgent=none"
          wolf_name: snapjack-bi
          wolf_runtime: claude
          wolf_den: /home/wolf/wolves/snapjack-bi/den
          wolf_config_dir: /home/wolf/wolves/snapjack-bi/claude
          telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN_SNAPJACK_BI') }}"

    cc_hosts:
      # Hosts that run the Wolfpack command-center bot. A host can be in
      # both cc_hosts and wolves (same droplet hosts both the bot and a
      # wolf). When the pack outgrows one box, move cc_hosts to its own
      # droplet; inventory is the only thing that needs to change.
      hosts:
        hal:
