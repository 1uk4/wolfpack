---
# pi-workspace role — builds the pi-wolf's den (Obsidian-compatible brain) at
# /home/wolf/workspace/den/ plus the shared/ receive-point for the Mac hub's
# read-only skill/template/pack library.
#
# Same on-disk layout as the Claude `workspace` role (so the syncthing role is
# reused unchanged), except the context file is pi-native AGENTS.md instead of
# CLAUDE.md. Static content is copied with force:false so wolf edits survive
# re-runs.

- name: Create den directory structure
  file:
    path: "/home/{{ wolf_user }}/workspace/den/{{ item }}"
    state: directory
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
  loop:
    - ""
    - memory
    - memory/daily
    - memory/checkpoints
    - tasks
    - knowledge
    - reports

- name: Create shared receive-point directory
  file:
    path: "/home/{{ wolf_user }}/workspace/shared"
    state: directory
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"

- name: Deploy AGENTS.md (pi context file — identity, rules, startup)
  template:
    src: AGENTS.md.j2
    dest: "/home/{{ wolf_user }}/workspace/den/AGENTS.md"
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
    force: false

- name: Deploy config.yml (wolf metadata)
  template:
    src: config.yml.j2
    dest: "/home/{{ wolf_user }}/workspace/den/config.yml"
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"

- name: Deploy static den files (force:false — never overwrite wolf edits)
  copy:
    src: "{{ item.src }}"
    dest: "/home/{{ wolf_user }}/workspace/den/{{ item.dest }}"
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
    force: false
  loop:
    - { src: "SOUL.md",      dest: "SOUL.md" }
    - { src: "MEMORY.md",    dest: "MEMORY.md" }
    - { src: "HEARTBEAT.md", dest: "HEARTBEAT.md" }
    - { src: "human.md",     dest: "memory/human.md" }
    - { src: "decisions.md", dest: "memory/decisions.md" }
    - { src: "lessons.md",   dest: "memory/lessons.md" }
    - { src: "errors.md",    dest: "memory/errors.md" }
    - { src: "inbox.md",     dest: "tasks/inbox.md" }
    - { src: "active.md",    dest: "tasks/active.md" }
    - { src: "done.md",      dest: "tasks/done.md" }

- name: Deploy .stignore in den and shared (Syncthing reads one per folder)
  copy:
    src: stignore
    dest: "/home/{{ wolf_user }}/workspace/{{ item }}/.stignore"
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
  loop:
    - den
    - shared
