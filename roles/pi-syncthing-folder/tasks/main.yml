---
# pi-syncthing-folder role — for CO-LOCATED pi wolves. Instead of standing up a
# second Syncthing instance (which would clash on ports 8384/22000), it adds
# this wolf's den as a new folder to the host's EXISTING syncthing@<user>
# instance via that instance's local REST API. The Mac device is already paired
# (from the original wolf), so you only accept the new folder on the Mac.

- name: Check the existing Syncthing config exists for this user
  stat:
    path: "/home/{{ wolf_user }}/.local/state/syncthing/config.xml"
  register: st_config

- name: Fail clearly if no existing Syncthing instance is present
  fail:
    msg: >-
      pi_colocated is set but no syncthing@{{ wolf_user }} config was found at
      /home/{{ wolf_user }}/.local/state/syncthing/config.xml. Co-located sync
      requires an existing Syncthing instance for '{{ wolf_user }}' (normally
      from the original wolf). Set pi_enable_syncthing: false to skip sync.
  when: not st_config.stat.exists

- name: Add this wolf's den folder to the existing Syncthing instance
  # Idempotent: only adds the folder (and ensures the Mac device) if missing.
  shell: |
    python3 - <<'PY'
    import json, re, sys, urllib.request, urllib.error

    CONFIG_XML = "/home/{{ wolf_user }}/.local/state/syncthing/config.xml"
    API_BASE   = "http://127.0.0.1:8384/rest"
    MAC_ID     = "{{ mac_syncthing_device_id }}"
    WOLF_NAME  = "{{ wolf_name }}"
    DEN_PATH   = "{{ pi_den_dir }}"

    if not MAC_ID or "REPLACE_ME" in MAC_ID:
        sys.exit("MAC_SYNCTHING_DEVICE_ID is unset — set it in .env and re-run.")

    with open(CONFIG_XML) as f:
        m = re.search(r"<apikey>([^<]+)</apikey>", f.read())
    if not m:
        sys.exit("Could not extract API key from config.xml")
    api_key = m.group(1)

    def api(method, path, body=None):
        req = urllib.request.Request(
            API_BASE + path, method=method,
            headers={"X-API-Key": api_key, "Content-Type": "application/json"},
            data=json.dumps(body).encode() if body is not None else None,
        )
        try:
            with urllib.request.urlopen(req) as resp:
                raw = resp.read()
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            sys.exit(f"REST {method} {path} -> {e.code}: {e.read().decode()}")

    # Ensure the Mac hub device exists (it normally already does).
    devices = api("GET", "/config/devices") or []
    if not any(d.get("deviceID") == MAC_ID for d in devices):
        api("POST", "/config/devices", {
            "deviceID": MAC_ID, "name": "mac-hub", "addresses": ["dynamic"],
            "compression": "metadata", "introducer": False,
            "autoAcceptFolders": False, "paused": False,
        })
        print("added mac-hub device")

    # Add the den folder if missing.
    folder_id = f"den-{WOLF_NAME}"
    folders = api("GET", "/config/folders") or []
    if any(f.get("id") == folder_id for f in folders):
        print(f"folder {folder_id} already present")
    else:
        api("POST", "/config/folders", {
            "id": folder_id, "label": f"{WOLF_NAME}-den", "path": DEN_PATH,
            "type": "sendreceive", "rescanIntervalS": 60,
            "fsWatcherEnabled": True, "fsWatcherDelayS": 10,
            "devices": [{"deviceID": MAC_ID}],
        })
        print(f"added folder {folder_id} (sendreceive) at {DEN_PATH}")

    print("OK")
    PY
  register: pi_st_folder
  changed_when: "'added' in pi_st_folder.stdout"
  when: st_config.stat.exists

- name: pi-syncthing-folder status
  debug:
    msg:
      - "🔗 den-{{ wolf_name }} added to the existing syncthing@{{ wolf_user }} instance."
      - "    ACTION on your Mac: accept folder 'den-{{ wolf_name }}' →"
      - "      ~/Code/wolfpack/dens/{{ wolf_name }}  (Send & Receive)"
      - "    The device is already paired, so no new device to accept."
  when: st_config.stat.exists
