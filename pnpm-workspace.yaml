packages:
  - "packages/*"
  - "apps/*"
linkWorkspacePackages: true
packageImportMethod: clone-or-copy
hoist: false
publicHoistPattern:
  - '@types/react'
  - '@types/react-dom'
# Mirror of "overrides" in package.json (npm reads that one, pnpm 12 ignores package.json's "pnpm" field).
# scripts/pnpm-config.test.ts keeps the two in step.
overrides:
  katex: 0.18.2
# pnpm 12 fails the install on any unlisted install script, so every package that has one is decided here.
# true: pi-claude-bridge-stateless is a git dependency whose prepare script builds it; esbuild's postinstall
#   checks (and may swap in) its native binary, as under npm.
# false: nothing needs these (binaries ship as optional dependencies; electron-winstaller only matters for Windows packaging).
allowBuilds:
  pi-claude-bridge@https://codeload.github.com/1uk4/pi-claude-bridge/tar.gz/91b1fc4d1f7be552c8e88913aaa7fa00c3058c8d: true
  esbuild: true
  "@google/genai": false
  electron-winstaller: false
  protobufjs: false
  unrs-resolver: false
