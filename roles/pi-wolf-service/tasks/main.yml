---
# pi-wolf-service role — deploys the startup wrapper + systemd unit that runs
# pi in a detached tmux session and auto-activates the Telegram bridge.
# PI equivalent of the `wolf-service` role.

- name: Ensure ~/.local/bin exists
  file:
    path: "/home/{{ wolf_user }}/.local/bin"
    state: directory
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
    mode: "0755"

- name: Deploy pi-wolf startup wrapper
  template:
    src: pi-wolf-run.sh.j2
    dest: "/home/{{ wolf_user }}/.local/bin/pi-wolf-run.sh"
    owner: "{{ wolf_user }}"
    group: "{{ wolf_user }}"
    mode: "0755"
  notify: restart pi-wolf

- name: Create systemd service
  template:
    src: pi-wolf.service.j2
    dest: "/etc/systemd/system/{{ wolf_name }}.service"
  notify: restart pi-wolf

- name: Flush handlers (restart now if unit/wrapper changed)
  meta: flush_handlers

- name: Enable and start pi-wolf service
  systemd:
    name: "{{ wolf_name }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for tmux session to exist
  command: sudo -iu {{ wolf_user }} tmux has-session -t {{ wolf_name }}
  register: pi_tmux_check
  retries: 12
  delay: 5
  until: pi_tmux_check.rc == 0
  changed_when: false
  failed_when: pi_tmux_check.rc != 0

- name: Capture live pane for a readiness/health peek
  shell: |
    sudo -iu {{ wolf_user }} tmux capture-pane -t {{ wolf_name }} -p -S -200
  register: pi_pane_capture
  retries: 18
  delay: 5
  # Consider the wolf healthy once pi's TUI is clearly running. We don't hard
  # fail on the telegram banner because bridge connection is best verified by
  # DMing the bot; a stuck pane (auth/login prompt) is the real failure mode.
  until: >
    ('context files' in pi_pane_capture.stdout) or
    ('skills' in pi_pane_capture.stdout) or
    ('esc' in (pi_pane_capture.stdout | lower)) or
    ('telegram' in (pi_pane_capture.stdout | lower))
  changed_when: false
  failed_when: false

- name: Check service status
  command: systemctl is-active {{ wolf_name }}
  register: pi_svc_active
  changed_when: false
  failed_when: false

- name: pi-wolf service status
  debug:
    msg:
      - "🐺 pi-wolf '{{ wolf_name }}' status: {{ pi_svc_active.stdout }}"
      - "    Attach to live pi session: sudo -iu {{ wolf_user }} tmux attach -t {{ wolf_name }}"
      - "    (detach with Ctrl-b then d — do NOT Ctrl-c, that kills pi)"
      - "    If the pane shows a /login prompt, pi has no credential — set"
      - "    ANTHROPIC_API_KEY in .env and re-run, or run /login in the pane."
      - "    Logs:   journalctl -u {{ wolf_name }} -f"
      - "    Verify: DM the Telegram bot and send /start."
